name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Building Qt6 from source via vcpkg takes 30-60 minutes on a cold
      # cache; caching the installed tree makes every run after the first
      # (or after bumping the key below) a matter of minutes.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-qtbase-widgets-x64-windows-v1

      - name: Install Qt6 (qtbase[widgets]) via vcpkg
        shell: pwsh
        run: vcpkg install "qtbase[widgets]:x64-windows"

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_BUILD_TYPE=Debug

      # Only the GUI, CLI, and the two dependency-free unit tests — the
      # smoke_* targets shell out to real ffmpeg/qpdf/7z/soffice binaries
      # that aren't installed on the CI image, so they're excluded here and
      # remain a manual verification step (see README).
      - name: Build
        shell: pwsh
        run: >
          cmake --build build --config Debug
          --target MagnifyFactory magnify test_ffmpeg_command_builder test_format_registry

      - name: Run unit tests
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure
