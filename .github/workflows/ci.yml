name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sets up cl.exe / the MSVC environment (equivalent of running from a
      # "Developer PowerShell for VS" / vcvarsall.bat) so Ninja can find the
      # compiler — the Visual Studio CMake generator isn't reliably available
      # by name on hosted runners, so this + Ninja is what's actually used.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Locate vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Building Qt6 from source via vcpkg takes 30-60 minutes on a cold
      # cache; caching the installed tree makes every run after the first
      # (or after bumping the key below) a matter of minutes.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-qtbase-widgets-x64-windows-v1

      - name: Install Qt6 (qtbase[widgets]) via vcpkg
        shell: pwsh
        run: vcpkg install "qtbase[widgets]:x64-windows"

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_BUILD_TYPE=Debug

      # Builds every target, including the smoke_* ones — those shell out to
      # real ffmpeg/qpdf/7z/soffice binaries at runtime so ctest never runs
      # them here (see README), but they still need to compile. An explicit
      # target list here would silently stop building new ctest targets
      # (e.g. test_job_manager) the moment someone adds one and forgets to
      # update this file — building everything can't go stale like that.
      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Run unit tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

  build-and-test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Distro Qt6 packages are prebuilt, so this is a normal apt install —
      # no vcpkg/from-source build (and no cache) needed on this platform.
      - name: Install build tools and Qt6
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
          build-essential cmake ninja-build qt6-base-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # Same rationale as the Windows job: build everything so a new ctest
      # target can never be silently skipped.
      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
